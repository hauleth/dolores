[package]
name = "dolores"
version = "0.1.0"
authors = ["Łukasz Niemier <lukasz@niemier.pl>"]
edition = "2021"
resolver = "2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"

[profile.dev.package.backtrace]
opt-level = 3

[dependencies]
askama = "0.12.1"
async-stream = "0.3"
async-trait = "0.1"
bincode = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
color-eyre = "0.6"
hyper = { version = "1", features = ["full"] }
matchit = "0.8"
nix = { version = "0.30", features = ["fs", "net", "signal", "socket"] }
indoc = "2"
once_cell = "1"
rand = "0.9"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1"
tracing-subscriber = "0.3"
hyper-util = { version = "0.1.9", default-features = false, features = ["server", "http1", "http2", "tokio", "server-auto"] }
